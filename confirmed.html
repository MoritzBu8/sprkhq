<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>You're in · SPRK</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family:'Inter'; font-style:normal; font-weight:300 600; font-display:swap; src:url(fonts/Inter-400.woff2) format('woff2'); }
@font-face { font-family:'JetBrains Mono'; font-style:normal; font-weight:400; font-display:swap; src:url(fonts/JetBrainsMono-400.woff2) format('woff2'); }
:root { --bg:#0d0d0d; --fg:#f2f0eb; --mute:#8a8780; --spark:#ff5a1f; }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body { background:var(--bg); color:var(--fg); font-family:Inter,system-ui,sans-serif; font-weight:300; -webkit-font-smoothing:antialiased; }
.hero { position:relative; min-height:100vh; display:flex; flex-direction:column; justify-content:space-between;
  background:linear-gradient(180deg,rgba(13,13,13,.55) 0%,rgba(13,13,13,.35) 40%,rgba(13,13,13,.92) 100%), url(img/tour-1-exterior.jpg) center/cover no-repeat; }
header { padding:28px 6vw; }
header img { height:22px; display:block; }
.copy { padding:0 6vw 12vh; max-width:820px; }
.mono { font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); }
.tag { color:var(--spark); }
h1 { font-weight:600; font-size:clamp(48px,9vw,112px); letter-spacing:-.03em; line-height:.95; margin:18px 0 22px; }
h1 span { color:var(--spark); }
p.lead { font-size:clamp(17px,2vw,20px); line-height:1.6; color:#d9d5cd; max-width:560px; }
.list { margin:26px 0 34px; display:flex; gap:22px; flex-wrap:wrap; }
.list div { border-top:1px solid #333; padding-top:10px; min-width:150px; }
.list b { display:block; font-weight:600; font-size:15px; color:var(--fg); margin-top:4px; }
.btns { display:flex; gap:14px; flex-wrap:wrap; }
a.btn { display:inline-block; padding:14px 26px; border-radius:999px; text-decoration:none; font-weight:600; font-size:15px; }
a.primary { background:var(--spark); color:#0d0d0d; }
a.ghost { border:1px solid #444; color:var(--fg); }
footer { padding:24px 6vw; text-align:center; border-top:1px solid #1f1f1f; }
footer a { color:var(--mute); }
</style>
</head>
<body>
<section class="hero">
  <header><a href="./"><img src="img/sprk-wordmark.svg" alt="SPRK"></a></header>
  <div class="copy">
    <p class="mono tag">Confirmed</p>
    <h1>You're in<span>.</span></h1>
    <p class="lead">You're first in line. When the doors get closer, you'll hear it here first.</p>
    <div class="list">
      <div><span class="mono">01</span><b>Opening news</b></div>
      <div><span class="mono">02</span><b>Early invites</b></div>
      <div><span class="mono">03</span><b>First merch drop</b></div>
    </div>
    <div class="btns">
      <a class="btn primary" href="./">Back to SPRK</a>
      <a class="btn ghost" href="mailto:hello@sprkhq.com">Say hello</a>
    </div>
  </div>
</section>
<footer class="mono">© 2026 SPRK · Garage. Coffee. Kitchen. · <a href="privacy.html">Privacy</a> · Concept renders</footer>
</body>
</html>
